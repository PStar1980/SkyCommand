name: skycommand

services:
  postgres:
    image: ${SKYCOMMAND_POSTGRES_IMAGE:-postgres:18.6-bookworm}
    container_name: skycommand-postgres
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: postgres
      SKYCOMMAND_SOURCE_PGPORT: ${SKYCOMMAND_POSTGRES_SOURCE_PORT:-5432}
      SKYCOMMAND_SOURCE_PGDATABASE: ${PGDATABASE:-skyserver_dev}
      SKYCOMMAND_SOURCE_PGUSER: ${PGUSER:-postgres}
      SKYCOMMAND_SOURCE_PGPASSWORD: ${PGPASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${SKYCOMMAND_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${PGUSER:-postgres} -d postgres"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s

  temporal-volume-init:
    image: alpine:3.23.4
    container_name: skycommand-temporal-volume-init
    user: "0:0"
    command:
      - sh
      - -c
      - mkdir -p /var/lib/temporal && chown -R 1000:1000 /var/lib/temporal
    volumes:
      - temporal_data:/var/lib/temporal
    restart: "no"

  temporal:
    image: temporalio/temporal:1.7.2
    container_name: skycommand-temporal
    depends_on:
      temporal-volume-init:
        condition: service_completed_successfully
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /var/lib/temporal/temporal.db
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8600:8233"
    volumes:
      - temporal_data:/var/lib/temporal
    healthcheck:
      test:
        - CMD
        - temporal
        - operator
        - cluster
        - health
        - --address
        - 127.0.0.1:7233
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s

  temporal-worker:
    build:
      context: .
      dockerfile: docker/temporal-worker.Dockerfile
    image: skycommand-temporal-worker:local
    container_name: skycommand-temporal-worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      PGHOST: ${SKYCOMMAND_DATABASE_HOST:-host.docker.internal}
      PGPORT: ${SKYCOMMAND_DATABASE_PORT:-5432}
      SKYCOMMAND_CONFIG_PROFILE: DOCKER_LOCAL
      SKYCOMMAND_RUNTIME_ENV: docker
      SKYCOMMAND_DOCKER_RUNTIME_LABEL: Docker Temporal worker
      SKYCOMMAND_DOCKER_GIT_CHECK_COMMAND: npm run temporal:worker:docker:git:check
      SKYCOMMAND_SCRIPT_RUNTIME_ROOT: /app
      SKYCOMMAND_SCRIPT_RUNTIME_REPOSITORY: SkyCommand
      SKYCOMMAND_BROWSER_SOURCE_REPOSITORY_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand
      SKYCOMMAND_BROWSER_ARTIFACT_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand/artifacts/browser/tests
      SKYCOMMAND_BROWSER_AUTOMATION_ARTIFACT_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand/artifacts/browser/automations
      SKYCOMMAND_EXECUTION_LOG_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand/logs/script-executions
      SKYCOMMAND_EXECUTION_LOG_PATH_MODE: relative
      SKYCOMMAND_DOCKER_HOST_WORKSPACE_ROOT: ${SKYCOMMAND_DOCKER_WORKSPACE_ROOT:-}
      SKYCOMMAND_DOCKER_CONTAINER_WORKSPACE_ROOT: /workspace/SkyEco System
      SKYCOMMAND_CONTAINER_HOST_ALIAS: host.docker.internal
      SKYCOMMAND_DOCKER_GIT_ENABLED: ${SKYCOMMAND_DOCKER_GIT_ENABLED:-false}
      SKYCOMMAND_GITHUB_HOST: "${SKYCOMMAND_GITHUB_HOST:-github.com}"
      SKYCOMMAND_GITHUB_USERNAME: "${SKYCOMMAND_GITHUB_USERNAME:-}"
      SKYCOMMAND_GITHUB_TOKEN_FILE: /run/secrets/skycommand_github_token
      GIT_AUTHOR_NAME: "${SKYCOMMAND_GIT_AUTHOR_NAME:-}"
      GIT_AUTHOR_EMAIL: "${SKYCOMMAND_GIT_AUTHOR_EMAIL:-}"
      GIT_COMMITTER_NAME: "${SKYCOMMAND_GIT_AUTHOR_NAME:-}"
      GIT_COMMITTER_EMAIL: "${SKYCOMMAND_GIT_AUTHOR_EMAIL:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${SKYCOMMAND_DOCKER_WORKSPACE_ROOT:-.}
        target: /workspace/SkyEco System
    secrets:
      - source: github_token
        target: skycommand_github_token
    restart: unless-stopped
    stop_grace_period: 30s

  agent-runtime-worker:
    build:
      context: .
      dockerfile: docker/agent-runtime-worker.Dockerfile
    image: skycommand-agent-runtime-worker:local
    container_name: skycommand-agent-runtime-worker
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      AGENT_RUNTIME_TASK_QUEUE: skycommand-agent-runtime-local
      AGENT_RUNTIME_WORKER_GENERATION: ${AGENT_RUNTIME_WORKER_GENERATION:-compose-local}
      AGENT_RUNTIME_WORKER_IDENTITY: agent-runtime-worker-compose
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    healthcheck:
      test:
        - CMD
        - node
        - apps/agent-runtime-worker/src/health.js
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 20s

  codex-managed-volume-init:
    build:
      context: .
      dockerfile: docker/codex-control-bridge.Dockerfile
    image: skycommand-codex-control-bridge:local
    container_name: skycommand-codex-managed-volume-init
    user: "0:0"
    command: ["node", "apps/codex-control-bridge/src/credentialInit.js"]
    environment:
      CODEX_BRIDGE_TOKEN_DIR: /run/codex-api-bridge
      CODEX_RUNTIME_TOKEN_DIR: /run/codex-runtime-control
      CODEX_MANAGED_HOME: /var/lib/codex
    volumes:
      - codex_api_bridge_token:/run/codex-api-bridge
      - codex_runtime_control_token:/run/codex-runtime-control
      - codex_managed_home:/var/lib/codex
    restart: "no"

  codex-mcp-gateway:
    build:
      context: .
      dockerfile: docker/codex-mcp-gateway.Dockerfile
    image: skycommand-codex-mcp-gateway:local
    container_name: skycommand-codex-mcp-gateway
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    networks:
      - codex_mcp_internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3981/healthz').then(async r=>{if(!r.ok||!(await r.json()).ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s
    pids_limit: 96
    mem_limit: 256m

  codex-egress-proxy:
    build:
      context: .
      dockerfile: docker/codex-egress-proxy.Dockerfile
    image: skycommand-codex-egress-proxy:local
    container_name: skycommand-codex-egress-proxy
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    networks:
      - codex_provider_internal
      - codex_provider_egress
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3128/healthz').then(async r=>{if(!r.ok||!(await r.json()).ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 10s
    pids_limit: 96
    mem_limit: 256m

  codex-agent-runtime-worker:
    build:
      context: .
      dockerfile: docker/codex-agent-runtime/Dockerfile
    image: skycommand-codex-agent-runtime-worker:local
    container_name: skycommand-codex-agent-runtime-worker
    depends_on:
      codex-managed-volume-init:
        condition: service_completed_successfully
      codex-mcp-gateway:
        condition: service_healthy
      codex-egress-proxy:
        condition: service_healthy
    environment:
      CODEX_RUNTIME_GENERATION: phase19-3a0
      CODEX_RUNTIME_CONTROL_TOKEN_FILE: /run/codex-runtime-control/runtime-control-token
      CODEX_RUNTIME_CONTROL_PORT: 4219
      CODEX_MANAGED_MCP_URL: http://skycommand-codex-mcp-gateway:3981/mcp
      HTTP_PROXY: http://skycommand-codex-egress-proxy:3128
      HTTPS_PROXY: http://skycommand-codex-egress-proxy:3128
      NO_PROXY: skycommand-codex-mcp-gateway,localhost,127.0.0.1
      http_proxy: http://skycommand-codex-egress-proxy:3128
      https_proxy: http://skycommand-codex-egress-proxy:3128
      no_proxy: skycommand-codex-mcp-gateway,localhost,127.0.0.1
      CODEX_DISABLE_AUTOUPDATE: "1"
      CODEX_RUNTIME_BUILD_ID: phase19-3a0-codex-cli-0.154.0
    volumes:
      - codex_managed_home:/var/lib/codex
      - codex_runtime_control_token:/run/codex-runtime-control:ro
    networks:
      codex_runtime_control:
        aliases:
          - codex-agent-runtime-worker-runtime-control
      codex_mcp_internal: {}
      codex_provider_internal: {}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    healthcheck:
      test:
        - CMD
        - node
        - apps/codex-agent-runtime-worker/src/healthcheck.js
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s
    restart: unless-stopped
    stop_grace_period: 15s
    pids_limit: 256
    mem_limit: 3g

  codex-control-bridge:
    build:
      context: .
      dockerfile: docker/codex-control-bridge.Dockerfile
    image: skycommand-codex-control-bridge:local
    container_name: skycommand-codex-control-bridge
    depends_on:
      codex-managed-volume-init:
        condition: service_completed_successfully
      codex-agent-runtime-worker:
        condition: service_healthy
    environment:
      CODEX_CONTROL_BRIDGE_PORT: 4220
      CODEX_RUNTIME_WORKER_URL: http://codex-agent-runtime-worker-runtime-control:4219
      CODEX_BRIDGE_TOKEN_FILE: /run/codex-api-bridge/api-bridge-token
      CODEX_RUNTIME_TOKEN_FILE: /run/codex-runtime-control/runtime-control-token
    volumes:
      - codex_api_bridge_token:/run/codex-api-bridge:ro
      - codex_runtime_control_token:/run/codex-runtime-control:ro
    networks:
      codex_api_control:
        aliases:
          - codex-control-bridge-api-control
      codex_runtime_control: {}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://codex-control-bridge-api-control:4220/healthz').then(async r=>{const p=await r.json();if(r.status!==200||p.ok!==true)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 10s
    pids_limit: 96
    mem_limit: 256m

  browser-worker:
    build:
      context: .
      dockerfile: docker/browser-worker.Dockerfile
    image: skycommand-browser-worker:local
    container_name: skycommand-browser-worker
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      SKYCOMMAND_BROWSER_TASK_QUEUE: ${SKYCOMMAND_BROWSER_TASK_QUEUE:-skycommand-browser-local}
      SKYCOMMAND_BROWSER_BASE_URL: ${SKYCOMMAND_BROWSER_DOCKER_BASE_URL:-http://web:8080}
      SKYCOMMAND_BROWSER_ARTIFACT_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand/artifacts/browser/tests
      SKYCOMMAND_BROWSER_AUTOMATION_ARTIFACT_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand/artifacts/browser/automations
      SKYCOMMAND_BROWSER_SOURCE_REPOSITORY_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand
      SKYCOMMAND_BROWSER_EXECUTION_TIMEOUT_MS: ${SKYCOMMAND_BROWSER_EXECUTION_TIMEOUT_MS:-600000}
      SKYCOMMAND_BROWSER_WORKER_MAX_CONCURRENT_ACTIVITIES: ${SKYCOMMAND_BROWSER_WORKER_MAX_CONCURRENT_ACTIVITIES:-1}
      SKYCOMMAND_BROWSER_WORKER_MAX_CONCURRENT_WORKFLOW_TASKS: ${SKYCOMMAND_BROWSER_WORKER_MAX_CONCURRENT_WORKFLOW_TASKS:-10}
      SKYCOMMAND_BROWSER_WORKER_HEARTBEAT_INTERVAL_MS: ${SKYCOMMAND_BROWSER_WORKER_HEARTBEAT_INTERVAL_MS:-10000}
      SKYCOMMAND_BROWSER_WORKER_HEALTH_FRESHNESS_MS: ${SKYCOMMAND_BROWSER_WORKER_HEALTH_FRESHNESS_MS:-45000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${SKYCOMMAND_DOCKER_WORKSPACE_ROOT:-.}
        target: /workspace/SkyEco System
    init: true
    ipc: host
    healthcheck:
      test:
        - CMD
        - node
        - apps/browser-worker/src/health.js
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  node-worker:
    build:
      context: .
      dockerfile: docker/node-worker.Dockerfile
    image: skycommand-node-worker:local
    container_name: skycommand-node-worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGHOST: ${SKYCOMMAND_DATABASE_HOST:-host.docker.internal}
      PGPORT: ${SKYCOMMAND_DATABASE_PORT:-5432}
      TEMPORAL_ADDRESS: temporal:7233
      SKYCOMMAND_CONFIG_PROFILE: DOCKER_LOCAL
      SKYCOMMAND_RUNTIME_ENV: docker
      SKYCOMMAND_EXECUTION_LOG_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand/logs/script-executions
      SKYCOMMAND_EXECUTION_LOG_PATH_MODE: relative
      SKYCOMMAND_DOCKER_HOST_WORKSPACE_ROOT: ${SKYCOMMAND_DOCKER_WORKSPACE_ROOT:-}
      SKYCOMMAND_DOCKER_CONTAINER_WORKSPACE_ROOT: /workspace/SkyEco System
      SKYCOMMAND_CONTAINER_HOST_ALIAS: host.docker.internal
      SKYCOMMAND_DOCKER_GIT_ENABLED: ${SKYCOMMAND_DOCKER_GIT_ENABLED:-false}
      SKYCOMMAND_GITHUB_HOST: "${SKYCOMMAND_GITHUB_HOST:-github.com}"
      SKYCOMMAND_GITHUB_USERNAME: "${SKYCOMMAND_GITHUB_USERNAME:-}"
      SKYCOMMAND_GITHUB_TOKEN_FILE: /run/secrets/skycommand_github_token
      GIT_AUTHOR_NAME: "${SKYCOMMAND_GIT_AUTHOR_NAME:-}"
      GIT_AUTHOR_EMAIL: "${SKYCOMMAND_GIT_AUTHOR_EMAIL:-}"
      GIT_COMMITTER_NAME: "${SKYCOMMAND_GIT_AUTHOR_NAME:-}"
      GIT_COMMITTER_EMAIL: "${SKYCOMMAND_GIT_AUTHOR_EMAIL:-}"
      WORKER_NODE_NAME: skycommand-node-worker-docker
      WORKER_SCHEDULER_ENABLED: ${WORKER_SCHEDULER_ENABLED:-true}
      WORKER_LISTENER_ENABLED: ${WORKER_LISTENER_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${SKYCOMMAND_DOCKER_WORKSPACE_ROOT:-.}
        target: /workspace/SkyEco System
    secrets:
      - source: github_token
        target: skycommand_github_token
    restart: unless-stopped
    stop_grace_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: skycommand-api:local
    container_name: skycommand-api
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      API_PORT: 7171
      PGHOST: ${SKYCOMMAND_DATABASE_HOST:-host.docker.internal}
      PGPORT: ${SKYCOMMAND_DATABASE_PORT:-5432}
      TEMPORAL_ADDRESS: temporal:7233
      SKYCOMMAND_CONFIG_PROFILE: DOCKER_LOCAL
      SKYCOMMAND_RUNTIME_ENV: docker
      # The host-native Supervisor remains the only Docker mutation plane. The
      # explicit host gateway keeps the API-to-Supervisor refresh seam separate
      # from the browser's loopback bootstrap URL.
      SKYCOMMAND_SUPERVISOR_API_URL: http://host.docker.internal:${SKYCOMMAND_SUPERVISOR_PORT:-17170}
      CODEX_CONTROL_BRIDGE_URL: http://codex-control-bridge-api-control:4220
      CODEX_CONTROL_BRIDGE_TOKEN_FILE: /run/codex-api-bridge/api-bridge-token
      # Fingerprint the mounted checkout used by the host Supervisor's Compose build,
      # not the API image's baked /app source that is authorizing the rebuild.
      SKYCOMMAND_MANAGED_CODEX_SOURCE_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand
      SKYCOMMAND_DOCKER_RUNTIME_LABEL: Docker API
      SKYCOMMAND_DOCKER_GIT_CHECK_COMMAND: npm run api:docker:git:check
      SKYCOMMAND_SCRIPT_RUNTIME_ROOT: /app
      SKYCOMMAND_SCRIPT_RUNTIME_REPOSITORY: SkyCommand
      SKYCOMMAND_BROWSER_SOURCE_REPOSITORY_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand
      SKYCOMMAND_BROWSER_ARTIFACT_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand/artifacts/browser/tests
      SKYCOMMAND_BROWSER_AUTOMATION_ARTIFACT_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand/artifacts/browser/automations
      SKYCOMMAND_EXECUTION_LOG_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand/logs/script-executions
      SKYCOMMAND_EXECUTION_LOG_PATH_MODE: relative
      SKYCOMMAND_DOCKER_HOST_WORKSPACE_ROOT: ${SKYCOMMAND_DOCKER_WORKSPACE_ROOT:-}
      SKYCOMMAND_DOCKER_CONTAINER_WORKSPACE_ROOT: /workspace/SkyEco System
      SKYCOMMAND_CONTAINER_HOST_ALIAS: host.docker.internal
      SKYCOMMAND_DOCKER_GIT_ENABLED: ${SKYCOMMAND_DOCKER_GIT_ENABLED:-false}
      SKYCOMMAND_GITHUB_HOST: "${SKYCOMMAND_GITHUB_HOST:-github.com}"
      SKYCOMMAND_GITHUB_USERNAME: "${SKYCOMMAND_GITHUB_USERNAME:-}"
      SKYCOMMAND_GITHUB_TOKEN_FILE: /run/secrets/skycommand_github_token
      GIT_AUTHOR_NAME: "${SKYCOMMAND_GIT_AUTHOR_NAME:-}"
      GIT_AUTHOR_EMAIL: "${SKYCOMMAND_GIT_AUTHOR_EMAIL:-}"
      GIT_COMMITTER_NAME: "${SKYCOMMAND_GIT_AUTHOR_NAME:-}"
      GIT_COMMITTER_EMAIL: "${SKYCOMMAND_GIT_AUTHOR_EMAIL:-}"
      SERVE_ADMIN_WEB: "false"
    networks:
      default: {}
      codex_api_control: {}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:7171:7171"
    volumes:
      - type: bind
        source: ${SKYCOMMAND_DOCKER_WORKSPACE_ROOT:-.}
        target: /workspace/SkyEco System
      - codex_api_bridge_token:/run/codex-api-bridge:ro
    secrets:
      - source: github_token
        target: skycommand_github_token
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7171/_health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_SUPERVISOR_BASE_URL: ${SKYCOMMAND_SUPERVISOR_BROWSER_URL:-http://127.0.0.1:17170}
    image: skycommand-web:local
    container_name: skycommand-web
    # The static control shell intentionally does not depend on the API. It remains
    # available while the SkyCommand runtime is stopped so a future login bootstrap
    # surface can start the runtime through the host-native Supervisor.
    ports:
      - "127.0.0.1:${SKYCOMMAND_WEB_PORT:-15171}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:8080/healthz"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  postgres_data:
    name: skycommand_postgres_data
  temporal_data:
    name: skycommand_temporal_data
  codex_managed_home:
    name: skycommand_codex_managed_home
  codex_api_bridge_token:
    name: skycommand_codex_api_bridge_token
  codex_runtime_control_token:
    name: skycommand_codex_runtime_control_token

networks:
  codex_api_control:
    name: skycommand_codex_api_control
    driver: bridge
    internal: true
  codex_runtime_control:
    name: skycommand_codex_runtime_control
    driver: bridge
    internal: true
  codex_mcp_internal:
    name: skycommand_codex_mcp_internal
    driver: bridge
    internal: true
  codex_provider_internal:
    name: skycommand_codex_provider_internal
    driver: bridge
    internal: true
  codex_provider_egress:
    name: skycommand_codex_provider_egress
    driver: bridge

secrets:
  github_token:
    file: "${SKYCOMMAND_DOCKER_GITHUB_TOKEN_FILE:-docker/empty-github-token}"
