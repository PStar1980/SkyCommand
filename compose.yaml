name: skycommand

services:
  temporal:
    image: temporalio/temporal:1.7.2
    container_name: skycommand-temporal
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /var/lib/temporal/temporal.db
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8600:8233"
    volumes:
      - temporal_data:/var/lib/temporal
    healthcheck:
      test:
        - CMD
        - temporal
        - operator
        - cluster
        - health
        - --address
        - 127.0.0.1:7233
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  temporal_data:
    name: skycommand_temporal_data
