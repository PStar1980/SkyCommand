name: skycommand

services:
  temporal-volume-init:
    image: alpine:3.23.4
    container_name: skycommand-temporal-volume-init
    user: "0:0"
    command:
      - sh
      - -c
      - mkdir -p /var/lib/temporal && chown -R 1000:1000 /var/lib/temporal
    volumes:
      - temporal_data:/var/lib/temporal
    restart: "no"

  temporal:
    image: temporalio/temporal:1.7.2
    container_name: skycommand-temporal
    depends_on:
      temporal-volume-init:
        condition: service_completed_successfully
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /var/lib/temporal/temporal.db
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8600:8233"
    volumes:
      - temporal_data:/var/lib/temporal
    healthcheck:
      test:
        - CMD
        - temporal
        - operator
        - cluster
        - health
        - --address
        - 127.0.0.1:7233
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  temporal_data:
    name: skycommand_temporal_data
