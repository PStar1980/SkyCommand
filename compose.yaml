name: skycommand

services:
  postgres:
    image: ${SKYCOMMAND_POSTGRES_IMAGE:-postgres:18.6-bookworm}
    container_name: skycommand-postgres
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: postgres
      SKYCOMMAND_SOURCE_PGPORT: ${SKYCOMMAND_POSTGRES_SOURCE_PORT:-5432}
      SKYCOMMAND_SOURCE_PGDATABASE: ${PGDATABASE:-skyserver_dev}
      SKYCOMMAND_SOURCE_PGUSER: ${PGUSER:-postgres}
      SKYCOMMAND_SOURCE_PGPASSWORD: ${PGPASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${SKYCOMMAND_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${PGUSER:-postgres} -d postgres"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s

  temporal-volume-init:
    image: alpine:3.23.4
    container_name: skycommand-temporal-volume-init
    user: "0:0"
    command:
      - sh
      - -c
      - mkdir -p /var/lib/temporal && chown -R 1000:1000 /var/lib/temporal
    volumes:
      - temporal_data:/var/lib/temporal
    restart: "no"

  temporal:
    image: temporalio/temporal:1.7.2
    container_name: skycommand-temporal
    depends_on:
      temporal-volume-init:
        condition: service_completed_successfully
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /var/lib/temporal/temporal.db
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8600:8233"
    volumes:
      - temporal_data:/var/lib/temporal
    healthcheck:
      test:
        - CMD
        - temporal
        - operator
        - cluster
        - health
        - --address
        - 127.0.0.1:7233
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s

  temporal-worker:
    build:
      context: .
      dockerfile: docker/temporal-worker.Dockerfile
    image: skycommand-temporal-worker:local
    container_name: skycommand-temporal-worker
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      PGHOST: host.docker.internal
      SKYCOMMAND_CONFIG_PROFILE: DOCKER_LOCAL
      SKYCOMMAND_RUNTIME_ENV: docker
      SKYCOMMAND_DOCKER_RUNTIME_LABEL: Docker Temporal worker
      SKYCOMMAND_DOCKER_GIT_CHECK_COMMAND: npm run temporal:worker:docker:git:check
      SKYCOMMAND_SCRIPT_RUNTIME_ROOT: /app
      SKYCOMMAND_SCRIPT_RUNTIME_REPOSITORY: SkyCommand
      SKYCOMMAND_EXECUTION_LOG_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand/logs/script-executions
      SKYCOMMAND_EXECUTION_LOG_PATH_MODE: relative
      SKYCOMMAND_DOCKER_HOST_WORKSPACE_ROOT: ${SKYCOMMAND_DOCKER_WORKSPACE_ROOT:-}
      SKYCOMMAND_DOCKER_CONTAINER_WORKSPACE_ROOT: /workspace/SkyEco System
      SKYCOMMAND_CONTAINER_HOST_ALIAS: host.docker.internal
      SKYCOMMAND_DOCKER_GIT_ENABLED: ${SKYCOMMAND_DOCKER_GIT_ENABLED:-false}
      SKYCOMMAND_GITHUB_HOST: "${SKYCOMMAND_GITHUB_HOST:-github.com}"
      SKYCOMMAND_GITHUB_USERNAME: "${SKYCOMMAND_GITHUB_USERNAME:-}"
      SKYCOMMAND_GITHUB_TOKEN_FILE: /run/secrets/skycommand_github_token
      GIT_AUTHOR_NAME: "${SKYCOMMAND_GIT_AUTHOR_NAME:-}"
      GIT_AUTHOR_EMAIL: "${SKYCOMMAND_GIT_AUTHOR_EMAIL:-}"
      GIT_COMMITTER_NAME: "${SKYCOMMAND_GIT_AUTHOR_NAME:-}"
      GIT_COMMITTER_EMAIL: "${SKYCOMMAND_GIT_AUTHOR_EMAIL:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${SKYCOMMAND_DOCKER_WORKSPACE_ROOT:-.}
        target: /workspace/SkyEco System
    secrets:
      - source: github_token
        target: skycommand_github_token
    restart: unless-stopped
    stop_grace_period: 30s

  node-worker:
    build:
      context: .
      dockerfile: docker/node-worker.Dockerfile
    image: skycommand-node-worker:local
    container_name: skycommand-node-worker
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGHOST: host.docker.internal
      TEMPORAL_ADDRESS: temporal:7233
      SKYCOMMAND_CONFIG_PROFILE: DOCKER_LOCAL
      SKYCOMMAND_RUNTIME_ENV: docker
      SKYCOMMAND_EXECUTION_LOG_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand/logs/script-executions
      SKYCOMMAND_EXECUTION_LOG_PATH_MODE: relative
      SKYCOMMAND_DOCKER_HOST_WORKSPACE_ROOT: ${SKYCOMMAND_DOCKER_WORKSPACE_ROOT:-}
      SKYCOMMAND_DOCKER_CONTAINER_WORKSPACE_ROOT: /workspace/SkyEco System
      SKYCOMMAND_CONTAINER_HOST_ALIAS: host.docker.internal
      SKYCOMMAND_DOCKER_GIT_ENABLED: ${SKYCOMMAND_DOCKER_GIT_ENABLED:-false}
      SKYCOMMAND_GITHUB_HOST: "${SKYCOMMAND_GITHUB_HOST:-github.com}"
      SKYCOMMAND_GITHUB_USERNAME: "${SKYCOMMAND_GITHUB_USERNAME:-}"
      SKYCOMMAND_GITHUB_TOKEN_FILE: /run/secrets/skycommand_github_token
      GIT_AUTHOR_NAME: "${SKYCOMMAND_GIT_AUTHOR_NAME:-}"
      GIT_AUTHOR_EMAIL: "${SKYCOMMAND_GIT_AUTHOR_EMAIL:-}"
      GIT_COMMITTER_NAME: "${SKYCOMMAND_GIT_AUTHOR_NAME:-}"
      GIT_COMMITTER_EMAIL: "${SKYCOMMAND_GIT_AUTHOR_EMAIL:-}"
      WORKER_NODE_NAME: skycommand-node-worker-docker
      WORKER_SCHEDULER_ENABLED: ${WORKER_SCHEDULER_ENABLED:-true}
      WORKER_LISTENER_ENABLED: ${WORKER_LISTENER_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${SKYCOMMAND_DOCKER_WORKSPACE_ROOT:-.}
        target: /workspace/SkyEco System
    secrets:
      - source: github_token
        target: skycommand_github_token
    restart: unless-stopped
    stop_grace_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: skycommand-api:local
    container_name: skycommand-api
    depends_on:
      temporal:
        condition: service_healthy
    env_file:
      - .env
    environment:
      API_PORT: 7171
      PGHOST: host.docker.internal
      TEMPORAL_ADDRESS: temporal:7233
      SKYCOMMAND_CONFIG_PROFILE: DOCKER_LOCAL
      SKYCOMMAND_RUNTIME_ENV: docker
      SKYCOMMAND_DOCKER_RUNTIME_LABEL: Docker API
      SKYCOMMAND_DOCKER_GIT_CHECK_COMMAND: npm run api:docker:git:check
      SKYCOMMAND_SCRIPT_RUNTIME_ROOT: /app
      SKYCOMMAND_SCRIPT_RUNTIME_REPOSITORY: SkyCommand
      SKYCOMMAND_EXECUTION_LOG_ROOT: /workspace/SkyEco System/SkyCommand System/SkyCommand/logs/script-executions
      SKYCOMMAND_EXECUTION_LOG_PATH_MODE: relative
      SKYCOMMAND_DOCKER_HOST_WORKSPACE_ROOT: ${SKYCOMMAND_DOCKER_WORKSPACE_ROOT:-}
      SKYCOMMAND_DOCKER_CONTAINER_WORKSPACE_ROOT: /workspace/SkyEco System
      SKYCOMMAND_CONTAINER_HOST_ALIAS: host.docker.internal
      SKYCOMMAND_DOCKER_GIT_ENABLED: ${SKYCOMMAND_DOCKER_GIT_ENABLED:-false}
      SKYCOMMAND_GITHUB_HOST: "${SKYCOMMAND_GITHUB_HOST:-github.com}"
      SKYCOMMAND_GITHUB_USERNAME: "${SKYCOMMAND_GITHUB_USERNAME:-}"
      SKYCOMMAND_GITHUB_TOKEN_FILE: /run/secrets/skycommand_github_token
      GIT_AUTHOR_NAME: "${SKYCOMMAND_GIT_AUTHOR_NAME:-}"
      GIT_AUTHOR_EMAIL: "${SKYCOMMAND_GIT_AUTHOR_EMAIL:-}"
      GIT_COMMITTER_NAME: "${SKYCOMMAND_GIT_AUTHOR_NAME:-}"
      GIT_COMMITTER_EMAIL: "${SKYCOMMAND_GIT_AUTHOR_EMAIL:-}"
      SERVE_ADMIN_WEB: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:7171:7171"
    volumes:
      - type: bind
        source: ${SKYCOMMAND_DOCKER_WORKSPACE_ROOT:-.}
        target: /workspace/SkyEco System
    secrets:
      - source: github_token
        target: skycommand_github_token
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7171/_health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: skycommand-web:local
    container_name: skycommand-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SKYCOMMAND_WEB_PORT:-5171}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:8080/healthz"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  postgres_data:
    name: skycommand_postgres_data
  temporal_data:
    name: skycommand_temporal_data

secrets:
  github_token:
    file: "${SKYCOMMAND_DOCKER_GITHUB_TOKEN_FILE:-docker/empty-github-token}"
