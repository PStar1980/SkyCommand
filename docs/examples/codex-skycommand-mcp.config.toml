# Example project-scoped Codex MCP configuration for SkyCommand.
# Copy/adapt this into .codex/config.toml; do not store the Assistant API token here.
[mcp_servers.skycommand]
command = "node"
args = ["scripts/mcp/skycommandMcpGateway.js"]
cwd = "C:/path/to/SkyCommand"
required = true
startup_timeout_sec = 20
tool_timeout_sec = 90
default_tools_approval_mode = "writes"
