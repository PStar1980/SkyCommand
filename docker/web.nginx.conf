server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Keep requests bounded to the API's existing JSON/upload envelope while
    # allowing enough headroom for headers and multipart metadata.
    client_max_body_size 2m;

    # Docker embedded DNS is used dynamically so an API container recreation
    # does not require the web container to be restarted just to learn its new
    # container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $skycommand_api api:7171;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Server-Sent Events must flow through immediately rather than waiting for
    # NGINX response buffering. The browser still authenticates with the normal
    # SkyCommand bearer token; only the transport behavior differs from JSON APIs.
    location = /api/infrastructure/providers/docker/events/stream {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_pass http://$skycommand_api;
    }

    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_pass http://$skycommand_api;
    }

    location = /_health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_pass http://$skycommand_api;
    }

    location ^~ /_db/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_pass http://$skycommand_api;
    }

    # Vite fingerprints production assets, so those files can be cached
    # aggressively while index.html remains fresh across deployments.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # BrowserRouter routes fall back to the SPA entry point while real files
    # (including /brand assets) continue to be served directly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
